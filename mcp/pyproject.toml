[project]
name = "tucan-mcp"
version = "0.1.0"
description = "Read-only MCP server for TU Darmstadt TUCaN (part of TUCaN Companion)"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "keyring>=25.7.0",
    "mcp>=2.3,<3",
    "opencv-python>=5.0.0.93",
    "requests>=2.34.2",
]

[project.scripts]
tucan-mcp = "tucan_mcp.server:main"
tucan-mcp-setup = "tucan_mcp.setup_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tucan_mcp"]
